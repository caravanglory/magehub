id: module-plugin
name: Plugin Development
version: '1.0.0'
category: module
description: Implement Magento 2 plugins (interceptors) following best practices for before, after, and around method interception

tags:
  - plugin
  - interceptor
  - di
  - around
  - before
  - after

magento_versions:
  - '2.4.x'

dependencies: []

use_when:
  - 'The task is to alter behavior of an existing public Magento method without modifying the original class.'
  - 'The task mentions before/after/around plugins, interceptors, plugin sortOrder, disabled plugins, or di.xml plugin configuration.'

do_not_use_when:
  - 'The target method is final, static, non-public, constructor/destructor, or otherwise not interceptable.'
  - 'A service contract implementation, observer, preference, event, or layout/config extension point is the safer project convention.'

required_inputs:
  - 'Target class, public method signature, desired before/after/around behavior, area scope, and expected interaction with existing plugins.'
  - 'Whether the plugin must preserve side effects, exceptions, and return-value contract exactly.'

workflow:
  - 'Inspect the target method signature, return type, visibility, existing plugins, and area-specific di.xml before choosing a plugin type.'
  - 'Prefer before plugins for argument normalization and after plugins for return-value decoration; use around only when skipping or wrapping execution is required.'
  - 'Create the plugin class with strict types, exact parameter/return typing, and minimal dependencies.'
  - 'Register the plugin in the narrowest applicable di.xml scope with an intentional name and sortOrder.'
  - 'Verify compile and targeted behavior after adding or changing the plugin.'

guardrails:
  - rule: 'Do not plugin final, static, private, protected, constructor, or destructor methods.'
  - rule: 'Around plugins must call and return $proceed() unless the task explicitly requires blocking execution.'
  - rule: 'Ask before pluginizing checkout, payment, customer authentication, inventory reservation, or price calculation flows.'
    approval_required: true

verification:
  - 'Run bin/magento setup:di:compile or the project wrapper after adding plugin classes or di.xml entries.'
  - 'Run targeted unit/integration tests for the modified behavior and at least one pass-through case.'
  - 'When changing plugin sortOrder, inspect sibling plugins and report the final execution order.'

output_contract:
  - 'State target class/method, plugin type, di.xml scope, plugin name, sortOrder, and whether $proceed() is preserved.'
  - 'Report compile/test commands and any unverified plugin-chain interactions.'

freshness:
  last_reviewed: '2026-06-28'
  sources:
    - 'Adobe Commerce 2.4.x plugins/interceptors docs'

instructions_file: instructions.md

conventions:
  - rule: 'Plugin class naming: {TargetClassShortName}{PluginPurpose}Plugin'
    example: 'ProductPriceModifierPlugin'
    rationale: 'Clear identification of what the plugin targets and does'

  - rule: 'Prefer before/after plugins over around plugins'
    example: 'Use afterGetPrice() instead of aroundGetPrice() when only modifying return value'
    rationale: 'Around plugins break the plugin chain if not implemented correctly'

  - rule: 'Always include type hints for all parameters'
    example: 'public function beforeSetName(Product $subject, string $name): array'
    rationale: 'Type safety and IDE autocompletion'

examples:
  - title: 'Before Plugin'
    description: 'Modify product name before saving'
    language: php
    code_file: examples/before-plugin.php

  - title: 'After Plugin'
    description: 'Append suffix to product name'
    language: php
    code_file: examples/after-plugin.php

  - title: 'di.xml Configuration'
    description: 'Plugin declaration'
    language: xml
    code_file: examples/di-xml-configuration.xml

anti_patterns:
  - pattern: 'Using around plugin when before/after would suffice'
    problem: 'Around plugins are harder to debug and can break plugin chain'
    solution: 'Only use around when you need to conditionally skip method execution'

  - pattern: 'Plugin on __construct method'
    problem: 'Constructor plugins are not supported'
    solution: 'Use preference or composition instead'

  - pattern: 'Plugin on private/protected methods'
    problem: 'Only public methods can be intercepted'
    solution: 'Consider preference if you must modify non-public methods'

files:
  - path: 'Plugin/{ClassName}Plugin.php'
    description: 'Plugin class file'
    template: |
      <?php
      declare(strict_types=1);

      namespace {{vendor}}\{{module}}\Plugin;

      class {{className}}Plugin
      {
          public function before{{method}}($subject, ...$args): array
          {
              return [...$args];
          }
      }

  - path: 'etc/di.xml'
    description: 'Plugin declaration'
    template: |
      <?xml version="1.0"?>
      <config xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation="urn:magento:framework:ObjectManager/etc/config.xsd">
          <type name="{{targetClass}}">
              <plugin name="{{pluginName}}"
                      type="{{vendor}}\{{module}}\Plugin\{{className}}Plugin"
                      sortOrder="10"/>
          </type>
      </config>

references:
  - title: 'Magento DevDocs: Plugins'
    url: 'https://developer.adobe.com/commerce/php/development/components/plugins/'
  - title: 'Plugin Best Practices'
    url: 'https://developer.adobe.com/commerce/php/best-practices/extensions/plugins/'

compatibility:
  - agents
  - claude
  - opencode
  - codex
  - qoder
