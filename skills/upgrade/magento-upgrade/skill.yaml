id: magento-upgrade
name: Magento Upgrade
version: '1.0.0'
category: upgrade
description: Plan and execute Magento 2 upgrades with UCT analysis, dependency waves, compatibility fixes, and verification gates

tags:
  - upgrade
  - compatibility
  - uct
  - composer
  - php
  - migration
  - dependency-graph

magento_versions:
  - '2.4.x'

dependencies: []

use_when:
  - 'The task is to plan, assess, or execute an Adobe Commerce or Magento Open Source version upgrade, patch-line move, PHP/runtime upgrade, or UCT-driven compatibility pass.'
  - 'The task mentions composer constraints, Upgrade Compatibility Tool, dependency waves, system requirements, service upgrades, or setup:upgrade readiness.'

do_not_use_when:
  - 'The task is a normal feature change or bug fix unrelated to platform/version compatibility.'
  - 'The user asks only for current-version module scaffolding, DI, plugin, setup, or performance work.'

required_inputs:
  - 'Current and target Magento/Adobe Commerce version, edition/package, PHP/runtime stack, deployment model, and environment wrapper.'
  - 'Custom module/theme inventory, third-party extension constraints, UCT availability, backup/rollback policy, and verification gates.'

workflow:
  - 'Run read-only inventory first, including Composer, platform versions, module status, custom code surface, and service dependencies.'
  - 'Check current Adobe release notes and system requirements when target requirements are unknown.'
  - 'Build dependency waves from module.xml, Composer requires, DI/plugins/observers, API surfaces, queues, cron, and theme dependencies.'
  - 'Apply composer/platform and code compatibility changes one wave at a time with verification after each wave.'
  - 'Keep a pending manual-work list for skipped or approval-sensitive items.'

guardrails:
  - rule: 'Do not run composer update to latest without an explicit target version and platform matrix.'
  - rule: 'Ask before editing HIGH impact modules such as checkout, payment, customer auth, database migrations, core preferences, or production deployment scripts.'
    approval_required: true
  - rule: 'Ask before running setup:upgrade, schema/data patches, or automatic UCT refactor commands.'
    approval_required: true

verification:
  - 'Run composer validate/install/update dry-run or equivalent dependency checks appropriate to the wave.'
  - 'Run setup:di:compile, targeted tests, GraphQL/API/schema checks, or smoke tests after each changed wave.'
  - 'End with an exact verification matrix showing commands run, commands skipped, and residual risk.'

output_contract:
  - 'Provide upgrade summary, readiness gates, wave plan, impact table, execution log, verification matrix, and pending manual work.'
  - 'Classify every module/package risk as HIGH, MEDIUM, or LOW with evidence.'

freshness:
  last_reviewed: '2026-06-28'
  sources:
    - 'Adobe Commerce upgrade guide, released versions, and system requirements'
    - 'Upgrade Compatibility Tool documentation'

instructions_file: instructions.md

conventions:
  - rule: 'Start with read-only inventory and target system requirements before editing Composer constraints'
    example: 'Check package, PHP, database, search, cache, queue, and service versions before changing composer.json'
    rationale: 'Most upgrade failures come from platform mismatch or extension constraints, not from the final setup:upgrade command.'

  - rule: 'Order custom module work by dependency waves'
    example: 'Fix Vendor_Foundation before Vendor_Checkout when checkout depends on foundation services'
    rationale: 'Dependency order keeps compile and runtime failures attributable to the smallest possible set of changes.'

  - rule: 'Treat UCT output as evidence, not as the full migration plan'
    example: 'Correlate UCT critical/errors with manual scans for plugins, preferences, GraphQL resolvers, and PHP compatibility'
    rationale: 'Automated checks catch many known issues, but Magento projects fail upgrades through project-specific integrations and runtime behavior.'

  - rule: 'Gate HIGH impact modules on explicit approval'
    example: 'Checkout, payment, customer auth, database migrations, and core class overrides need plan approval before edits'
    rationale: 'High-blast-radius areas can affect revenue, data integrity, or authentication and should not be changed silently.'

  - rule: 'Verify after each wave with the smallest meaningful command set'
    example: 'Run setup:di:compile after DI signature fixes, targeted PHPUnit after service changes, and GraphQL compare after schema changes'
    rationale: 'Fast wave-level verification localizes failures and prevents a final all-or-nothing debugging session.'

  - rule: 'Keep upgrade commits free of opportunistic refactors'
    example: 'Do not rename services or redesign repositories while replacing removed framework APIs'
    rationale: 'Upgrade branches are already risky. Extra refactors make rollback and review harder without improving compatibility.'

examples:
  - title: 'UCT analysis runner'
    description: 'Runs Upgrade Compatibility Tool checks for a target version and stores reports under var/upgrade-reports'
    language: bash
    code_file: examples/uct-analysis.sh

  - title: 'Upgrade plan template'
    description: 'Markdown template for target stack, readiness gates, wave plan, impact table, and pending manual work'
    language: markdown
    code_file: examples/upgrade-plan.md

  - title: 'Module wave report'
    description: 'Example wave breakdown that keeps dependency providers ahead of dependent checkout or API modules'
    language: markdown
    code_file: examples/module-wave-report.md

  - title: 'Composer platform constraint snippet'
    description: 'Example target package and PHP platform constraint to make dependency resolution deterministic'
    language: json
    code_file: examples/composer-platform-constraints.json

anti_patterns:
  - pattern: 'Running composer update to latest without a target version and platform matrix'
    problem: 'Composer may resolve a package set that does not match the deployed PHP, database, search, or cloud service versions.'
    solution: 'Choose the target Commerce patch line first, check Adobe system requirements, then update explicit constraints.'

  - pattern: 'Running setup:upgrade before dependency conflicts and compile failures are understood'
    problem: 'Database and generated-code changes can make rollback harder while the codebase is still incompatible.'
    solution: 'Resolve Composer, PHP compatibility, and DI compile blockers before applying schema/data upgrades.'

  - pattern: 'Fixing every custom module in one large unreviewable diff'
    problem: 'Failures become hard to isolate, and reviewers cannot distinguish compatibility fixes from unrelated refactors.'
    solution: 'Group modules into dependency waves and verify each wave before moving on.'

  - pattern: 'Trusting UCT as the only source of upgrade truth'
    problem: 'Project-specific integrations, payment/shipping flows, queue consumers, and frontend behavior can fail outside static compatibility checks.'
    solution: 'Combine UCT with manual scans, targeted tests, smoke tests, and business-critical workflow verification.'

  - pattern: 'Ignoring runtime service upgrades while only changing PHP code'
    problem: 'Search, database, queue, cache, and cloud service mismatches can fail in staging or production even when code compiles locally.'
    solution: 'Track service versions as first-class readiness gates and coordinate cloud support tickets where required.'

  - pattern: 'Disabling CSP, cache, 2FA, or validation globally to make the upgrade pass'
    problem: 'Broad disables hide compatibility defects and can reduce security or performance after launch.'
    solution: 'Add narrow CSP rules, fix cache identities, preserve security controls, and document any temporary exception with an owner and expiry.'

files:
  - path: 'UPGRADE_PLAN.md'
    description: 'Upgrade planning worksheet for module waves, risk assessment, verification, and pending manual work'
    template: |
      # Magento Upgrade Plan

      ## Summary
      - Source version: {{source_version}}
      - Target version: {{target_version}}
      - Edition: {{edition}}
      - Runtime changes: {{runtime_changes}}

      ## Readiness Gates
      - [ ] Clean upgrade branch
      - [ ] Database backup confirmed
      - [ ] Target system requirements checked
      - [ ] Third-party extension compatibility checked
      - [ ] Verification commands agreed

      ## Wave Plan
      | Wave | Scope | Modules or packages | Risk | Verification |
      | --- | --- | --- | --- | --- |
      | 0 | Platform and Composer | {{platform_scope}} | {{platform_risk}} | composer install |

      ## Pending Manual Work
      | Owner | Module/file | Risk | Next action |
      | --- | --- | --- | --- |

references:
  - title: 'Adobe Commerce: Upgrade Compatibility Tool'
    url: 'https://experienceleague.adobe.com/en/docs/commerce-operations/upgrade-guide/upgrade-compatibility-tool/use-upgrade-compatibility-tool/run'
  - title: 'Adobe Commerce: System requirements'
    url: 'https://experienceleague.adobe.com/en/docs/commerce-operations/installation-guide/system-requirements'
  - title: 'Adobe Commerce: Upgrade prerequisites'
    url: 'https://experienceleague.adobe.com/en/docs/commerce-operations/upgrade-guide/prepare/prerequisites'
  - title: 'Adobe Commerce: Released versions'
    url: 'https://experienceleague.adobe.com/en/docs/commerce-operations/release/versions'

compatibility:
  - agents
  - claude
  - opencode
  - codex
  - qoder
